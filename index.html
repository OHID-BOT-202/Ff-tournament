<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aura Esports</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Noto+Sans+Bengali:wght@400;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#06070b;color:#fff;font-family:"Noto Sans Bengali",sans-serif}
header{position:sticky;top:0;z-index:10;background:#07080ddd;backdrop-filter:blur(15px);border-bottom:1px solid #252833}
.nav{max-width:1150px;margin:auto;min-height:70px;padding:10px 18px;display:flex;align-items:center;justify-content:space-between}
.logo-text{font:800 22px Orbitron;color:#fff;letter-spacing:1px}.nav img{height:48px;width:48px;object-fit:cover;border-radius:50%;margin-right:10px}.brand{display:flex;align-items:center}
.btn{border:0;border-radius:11px;padding:11px 16px;color:#fff;font-weight:700;background:#20242d}.primary{background:#e31b23}.green{background:#16834d}.outline{background:transparent;border:1px solid #343945}
.container{max-width:1150px;margin:auto;padding:0 18px}.hero{margin-top:18px;position:relative;overflow:hidden;border-radius:20px;border:1px solid #2d313b}
.hero img{width:100%;display:block;max-height:570px;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0007,transparent 65%);pointer-events:none}
.hero-content{position:absolute;z-index:2;left:28px;bottom:28px}.hero-content h1{font:800 clamp(30px,6vw,65px) Orbitron;margin:0}.hero-content p{color:#ddd;margin:10px 0 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stat{background:#11141b;border:1px solid #292d37;border-radius:15px;padding:18px;text-align:center}.stat b{display:block;font:700 28px Orbitron;color:#fff}.stat span{color:#aeb3bf;font-size:13px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:30px 0 15px;gap:10px}.section-head h2{margin:0;font-size:23px}
.toolbar{display:flex;gap:10px;margin-bottom:16px}.input,.select{width:100%;background:#0e1117;color:#fff;border:1px solid #2c303a;border-radius:10px;padding:12px;outline:0}.select{max-width:180px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.card{overflow:hidden;background:#101319;border:1px solid #292d37;border-radius:17px}.card-banner{width:100%;height:145px;object-fit:cover}.card-body{padding:16px}.card h3{margin:0 0 10px;font-size:18px}.row{display:flex;justify-content:space-between;gap:8px;color:#aeb3bf;font-size:13px;margin:8px 0}.row b{color:#fff;text-align:right}.badge{display:inline-block;padding:4px 9px;border-radius:20px;font-size:11px;background:#143e2b;color:#63e0a1}.closed{background:#402027;color:#ff8b9a}.card-actions{display:flex;gap:8px;margin-top:14px}.card-actions button{flex:1}
.empty{grid-column:1/-1;text-align:center;background:#101319;border:1px solid #292d37;border-radius:17px;padding:25px}.empty img{width:160px;max-width:70%;margin-bottom:8px}
.modal{position:fixed;inset:0;z-index:30;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px}.box{width:min(500px,100%);max-height:92vh;overflow:auto;background:#11151d;border:1px solid #353a46;border-radius:18px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0}.close{background:none;border:0;color:#fff;font-size:26px}.group{margin:12px 0}.group label{display:block;color:#aeb3bf;font-size:13px;margin-bottom:6px}.actions{display:flex;gap:8px;margin-top:15px}.actions button{flex:1}.tabs{display:flex;gap:8px;margin:15px 0}.tabs button{flex:1}.msg{display:none;padding:10px;border-radius:9px;margin:10px 0;background:#25161a;color:#ff9baa;font-size:13px}.show{display:block}.success{background:#11271d;color:#65dfa1}.hidden{display:none!important}
footer{text-align:center;color:#777;padding:40px 0 25px;font-size:13px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.logo-text{font-size:16px}.stats{gap:7px}.stat{padding:13px 6px}.stat b{font-size:20px}.grid{grid-template-columns:1fr}.toolbar{display:grid}.select{max-width:none}.hero-content{left:18px;bottom:18px}.hero-content p{font-size:13px}}
</style>
</head>
<body>
<header><div class="nav">
<div class="brand"><img src="assets/logo.png" alt="Aura Esports"><span class="logo-text">AURA ESPORTS</span></div>
<div><span id="email" style="color:#aaa;font-size:12px;margin-right:8px"></span><button id="loginBtn" class="btn outline" onclick="openAuth()">Login</button><button id="logoutBtn" class="btn hidden" onclick="logout()">Logout</button></div>
</div></header>

<main class="container">
<section class="hero">
<img src="assets/banner.jpg" alt="Aura Esports Tournament Banner">
<div class="hero-content"><h1>AURA ESPORTS</h1><p>Free Fire Tournament Arena</p><button class="btn primary" onclick="goTournament()">View Tournaments</button></div>
</section>

<div class="stats">
<div class="stat"><b id="total">0</b><span>Total Tournaments</span></div>
<div class="stat"><b id="open">0</b><span>Open Tournaments</span></div>
<div class="stat"><b id="prize">৳0</b><span>Total Prize Pool</span></div>
</div>

<div class="section-head"><h2>🎮 Tournaments</h2><button class="btn outline" onclick="loadTournaments()">Refresh</button></div>
<div class="toolbar"><input id="search" class="input" placeholder="Tournament search..." oninput="render()"><select id="filter" class="select" onchange="render()"><option value="all">All Status</option><option value="open">Open</option><option value="closed">Closed</option><option value="cancelled">Cancelled</option></select></div>
<div id="grid" class="grid"></div>
</main>

<footer>© 2026 Aura Esports</footer>

<div id="authModal" class="modal hidden"><div class="box">
<div class="modal-head"><h2 id="authTitle">Login</h2><button class="close" onclick="closeModal('authModal')">×</button></div>
<div class="tabs"><button id="lt" class="btn primary" onclick="switchAuth('login')">Login</button><button id="st" class="btn outline" onclick="switchAuth('signup')">Signup</button></div>
<div id="authMsg" class="msg"></div>
<form onsubmit="auth(event)">
<div id="nameGroup" class="group hidden"><label>Full Name</label><input id="name" class="input"></div>
<div class="group"><label>Email</label><input id="aemail" type="email" class="input" required></div>
<div class="group"><label>Password</label><input id="apass" type="password" minlength="6" class="input" required></div>
<button id="authSubmit" class="btn primary" style="width:100%">Login</button>
</form></div></div>

<div id="createModal" class="modal hidden"><div class="box">
<div class="modal-head"><h2>Create Tournament</h2><button class="close" onclick="closeModal('createModal')">×</button></div>
<div id="createMsg" class="msg"></div>
<form onsubmit="createTournament(event)">
<div class="group"><label>Tournament Name</label><input id="tname" class="input" required></div>
<div class="group"><label>Location / Room</label><input id="loc" class="input"></div>
<div class="group"><label>Start Date & Time</label><input id="start" type="datetime-local" class="input" required></div>
<div class="group"><label>End Date & Time</label><input id="end" type="datetime-local" class="input" required></div>
<div class="group"><label>Participant Limit</label><input id="limit" type="number" min="2" value="25" class="input" required></div>
<div class="group"><label>Prize Pool</label><input id="pool" type="number" min="0" value="0" class="input" required></div>
<div class="actions"><button type="button" class="btn outline" onclick="closeModal('createModal')">Cancel</button><button class="btn green">Create</button></div>
</form></div></div>

<script>
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_PUBLIC_KEY";
const configured=!SUPABASE_URL.startsWith("YOUR_")&&!SUPABASE_ANON_KEY.startsWith("YOUR_");
let db=null, user=null, data=[], mode="login";
if(configured) db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const $=id=>document.getElementById(id);
function closeModal(id){$(id).classList.add("hidden")}
function openAuth(){switchAuth("login");$("authModal").classList.remove("hidden")}
function msg(id,text,ok=false){$(id).textContent=text;$(id).className="msg show"+(ok?" success":"")}
function switchAuth(m){mode=m;$("authTitle").textContent=m==="login"?"Login":"Create Account";$("authSubmit").textContent=m==="login"?"Login":"Signup";$("nameGroup").classList.toggle("hidden",m==="login");$("lt").className="btn "+(m==="login"?"primary":"outline");$("st").className="btn "+(m==="signup"?"primary":"outline")}
async function auth(e){e.preventDefault();if(!db)return msg("authMsg","আগে Supabase URL ও anon public key বসাও।");let email=$("aemail").value.trim(),password=$("apass").value,result;
if(mode==="signup")result=await db.auth.signUp({email,password,options:{data:{full_name:$("name").value.trim()}}});else result=await db.auth.signInWithPassword({email,password});
if(result.error)return msg("authMsg",result.error.message);if(mode==="signup")msg("authMsg","Signup সফল। Email verification চালু থাকলে inbox চেক করো।",true);else closeModal("authModal")}
async function logout(){if(db)await db.auth.signOut()}
function authUI(){if(user){$("email").textContent=user.email||"";$("loginBtn").classList.add("hidden");$("logoutBtn").classList.remove("hidden")}else{$("email").textContent="";$("loginBtn").classList.remove("hidden");$("logoutBtn").classList.add("hidden")}}
function createOpen(){if(!user){openAuth();return msg("authMsg","Tournament তৈরি করতে Login করো।")}$("createModal").classList.remove("hidden")}
async function createTournament(e){e.preventDefault();if(!db||!user)return;let obj={tournament_name:$("tname").value.trim(),location:$("loc").value.trim(),start_date:new Date($("start").value).toISOString(),end_date:new Date($("end").value).toISOString(),status:"open",participant_limit:+$("limit").value,prize_pool:+$("pool").value};let {error}=await db.from("tournaments").insert(obj);if(error)return msg("createMsg",error.message);msg("createMsg","Tournament created successfully.",true);setTimeout(()=>{closeModal("createModal");loadTournaments()},700)}
async function loadTournaments(){if(!db){data=[];render();return}let {data:d,error}=await db.from("tournaments").select("*").order("created_at",{ascending:false});if(error){$("grid").innerHTML='<div class="empty">Database error: '+esc(error.message)+'</div>';return}data=d||[];render()}
function render(){let q=$("search").value.toLowerCase(),f=$("filter").value;let list=data.filter(x=>(!q||String(x.tournament_name||"").toLowerCase().includes(q)||String(x.location||"").toLowerCase().includes(q))&&(f==="all"||String(x.status).toLowerCase()===f));$("total").textContent=data.length;$("open").textContent=data.filter(x=>String(x.status).toLowerCase()==="open").length;$("prize").textContent="৳"+data.reduce((s,x)=>s+Number(x.prize_pool||0),0).toLocaleString("en-BD");
if(!list.length){$("grid").innerHTML='<div class="empty"><img src="assets/empty.png"><div>No tournaments found.</div></div>';return}
$("grid").innerHTML=list.map(x=>{let st=String(x.status||"open").toLowerCase(),closed=st!=="open";return `<article class="card"><img class="card-banner" src="assets/card-banner.jpg"><div class="card-body"><h3>${esc(x.tournament_name||"Tournament")}</h3><span class="badge ${closed?"closed":""}">${esc(st.toUpperCase())}</span><div class="row"><span>📍 Location</span><b>${esc(x.location||"Online")}</b></div><div class="row"><span>🗓 Start</span><b>${date(x.start_date)}</b></div><div class="row"><span>👥 Players</span><b>${Number(x.participant_limit||0)}</b></div><div class="row"><span>🏆 Prize</span><b>৳${Number(x.prize_pool||0).toLocaleString("en-BD")}</b></div><div class="card-actions"><button class="btn ${closed?"outline":"primary"}" ${closed?"disabled":""} onclick="join('${x.id}')">${closed?"Not Available":"Join Tournament"}</button></div></div></article>`}).join("")}
function join(id){if(!user){openAuth();return msg("authMsg","Join করতে Login করো।")}let x=data.find(a=>a.id===id);alert("Selected: "+(x?.tournament_name||"Tournament")+"\nParticipant table যোগ করলে এখানে real Join system চালু করা যাবে।")}
function date(v){if(!v)return"Not set";let d=new Date(v);return isNaN(d)?"Not set":d.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}
function esc(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function goTournament(){$("grid").scrollIntoView({behavior:"smooth"})}
async function init(){if(!db){render();return}let s=await db.auth.getSession();user=s.data.session?.user||null;authUI();db.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;authUI()});loadTournaments()}
init();
</script>
</body>
</html>
